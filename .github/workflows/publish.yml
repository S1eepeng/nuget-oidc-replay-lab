name: NuGet.org Trusted Publishing replay lab

on:
  workflow_dispatch:
    inputs:
      encryption_public_key_b64:
        description: Base64-encoded RSA public key for encrypted secret evidence
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  replay-experiment:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build the calculator package
        run: dotnet build src/S1eepeng.NuGetOidcReplayLab/S1eepeng.NuGetOidcReplayLab.csproj --configuration Release

      - name: Request JWTs, exchange API keys, publish, and test replay
        shell: bash
        env:
          PUBLIC_KEY_B64: ${{ inputs.encryption_public_key_b64 }}
          TOKEN_ENDPOINT: https://www.nuget.org/api/v2/token
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
          NUGET_USERNAME: s1eepeng
          PROJECT: src/S1eepeng.NuGetOidcReplayLab/S1eepeng.NuGetOidcReplayLab.csproj
          PACKAGE_ID: S1eepeng.NuGetOidcReplayLab
        run: |
          set -euo pipefail

          secret="$RUNNER_TEMP/nuget-oidc-secret"
          artifact="$RUNNER_TEMP/nuget-oidc-artifact"
          mkdir -p "$secret" "$artifact"

          cleanup() {
            rm -rf "$secret"
            rm -f "$RUNNER_TEMP/nuget-evidence-key" "$RUNNER_TEMP/nuget-evidence.tar.gz" "$RUNNER_TEMP/nuget-public.pem"
          }
          trap cleanup EXIT

          printf '%s' "$PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/nuget-public.pem"

          request_jwt() {
            curl --silent --show-error --fail --get \
              --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --data-urlencode 'audience=https://www.nuget.org' \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value'
          }

          jwt1="$(request_jwt)"
          jwt2="$(request_jwt)"
          test -n "$jwt1"
          test -n "$jwt2"
          test "$jwt1" != "$jwt2"
          echo "::add-mask::$jwt1"
          echo "::add-mask::$jwt2"
          printf '%s' "$jwt1" > "$secret/github-oidc-1.jwt"
          printf '%s' "$jwt2" > "$secret/github-oidc-2.jwt"

          JWT1="$jwt1" JWT2="$jwt2" python3 - "$secret/jwts-decoded.json" <<'PY'
          import base64, json, os, pathlib, sys

          def decode_part(value):
              value += "=" * (-len(value) % 4)
              return json.loads(base64.urlsafe_b64decode(value))

          def decode_jwt(value):
              header, payload, _signature = value.split(".")
              return {"header": decode_part(header), "claims": decode_part(payload)}

          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "jwt1": decode_jwt(os.environ["JWT1"]),
              "jwt2": decode_jwt(os.environ["JWT2"]),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          exchange() {
            local jwt="$1"
            local output="$2"
            curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json' \
              --header 'User-Agent: nuget-oidc-replay-lab/1.0' \
              --header "Authorization: Bearer $jwt" \
              --data "$(jq -cn --arg username "$NUGET_USERNAME" '{username:$username,tokenType:"ApiKey"}')" \
              "$TOKEN_ENDPOINT"
          }

          exchange1_at="$(date --utc --iso-8601=seconds)"
          exchange1_status="$(exchange "$jwt1" "$secret/exchange-1-response.json")"
          echo "EXCHANGE_1_HTTP_STATUS=$exchange1_status"
          test "$exchange1_status" = "200"
          key1="$(jq -r '.apiKey' "$secret/exchange-1-response.json")"
          test -n "$key1"
          test "$key1" != "null"
          echo "::add-mask::$key1"

          replay_at="$(date --utc --iso-8601=seconds)"
          replay_status="$(exchange "$jwt1" "$secret/exchange-jwt1-replay-response.json")"
          echo "EXACT_JWT_REPLAY_HTTP_STATUS=$replay_status"

          exchange2_at="$(date --utc --iso-8601=seconds)"
          exchange2_status="$(exchange "$jwt2" "$secret/exchange-2-response.json")"
          echo "EXCHANGE_2_HTTP_STATUS=$exchange2_status"
          test "$exchange2_status" = "200"
          key2="$(jq -r '.apiKey' "$secret/exchange-2-response.json")"
          test -n "$key2"
          test "$key2" != "null"
          test "$key1" != "$key2"
          echo "::add-mask::$key2"

          pack_version() {
            local version="$1"
            local output_dir="$secret/package-$version"
            mkdir -p "$output_dir"
            dotnet pack "$PROJECT" --configuration Release --no-build \
              --output "$output_dir" -p:PackageVersion="$version" >/dev/null
            printf '%s/%s.%s.nupkg' "$output_dir" "$PACKAGE_ID" "$version"
          }

          publish_with_key() {
            local key="$1"
            local version="$2"
            local output="$3"
            local package
            package="$(pack_version "$version")"
            test -f "$package"
            set +e
            dotnet nuget push "$package" --api-key "$key" --source "$NUGET_SOURCE" >"$output" 2>&1
            local status="$?"
            set -e
            cp "$package" "$secret/"
            printf '%s' "$status"
          }

          publish1_at="$(date --utc --iso-8601=seconds)"
          publish1_exit="$(publish_with_key "$key1" '0.0.2' "$secret/publish-key1-v0.0.2.log")"
          echo "KEY1_PUBLISH_0_0_2_EXIT=$publish1_exit"

          publish2_at="$(date --utc --iso-8601=seconds)"
          publish2_exit="$(publish_with_key "$key2" '0.0.3' "$secret/publish-key2-v0.0.3.log")"
          echo "KEY2_PUBLISH_0_0_3_EXIT=$publish2_exit"

          publish3_at="$(date --utc --iso-8601=seconds)"
          publish3_exit="$(publish_with_key "$key1" '0.0.4' "$secret/publish-key1-reuse-v0.0.4.log")"
          echo "KEY1_REUSE_PUBLISH_0_0_4_EXIT=$publish3_exit"

          JWT1="$jwt1" JWT2="$jwt2" KEY1="$key1" KEY2="$key2" python3 - \
            "$secret/http-evidence.secret.json" "$exchange1_at" "$replay_at" "$exchange2_at" \
            "$exchange1_status" "$replay_status" "$exchange2_status" \
            "$publish1_at" "$publish2_at" "$publish3_at" \
            "$publish1_exit" "$publish2_exit" "$publish3_exit" "$secret" <<'PY'
          import hashlib, json, os, pathlib, sys

          (output_path, exchange1_at, replay_at, exchange2_at,
           exchange1_status, replay_status, exchange2_status,
           publish1_at, publish2_at, publish3_at,
           publish1_exit, publish2_exit, publish3_exit, secret_dir) = sys.argv[1:]

          secret = pathlib.Path(secret_dir)
          jwt1, jwt2 = os.environ["JWT1"], os.environ["JWT2"]
          key1, key2 = os.environ["KEY1"], os.environ["KEY2"]

          def read(name):
              return (secret / name).read_text(encoding="utf-8")

          def sha256_text(value):
              return hashlib.sha256(value.encode()).hexdigest()

          def package_sha(version):
              return hashlib.sha256((secret / f"S1eepeng.NuGetOidcReplayLab.{version}.nupkg").read_bytes()).hexdigest()

          body = {"username": "s1eepeng", "tokenType": "ApiKey"}
          exchange_endpoint = "https://www.nuget.org/api/v2/token"
          push_endpoint = "https://www.nuget.org/api/v2/package"

          def exchange_record(name, at, jwt, status, response_file):
              return {
                  "name": name,
                  "at": at,
                  "request": {
                      "method": "POST",
                      "url": exchange_endpoint,
                      "headers": {
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "nuget-oidc-replay-lab/1.0",
                          "Authorization": f"Bearer {jwt}",
                      },
                      "body": body,
                  },
                  "response": {"status": int(status), "body": read(response_file)},
              }

          def publish_record(key_name, key, version, at, exit_code, log_file):
              return {
                  "key": key_name,
                  "version": version,
                  "at": at,
                  "request": {
                      "method": "PUT",
                      "url": push_endpoint,
                      "headers": {"X-NuGet-ApiKey": key},
                      "package_sha256": package_sha(version),
                  },
                  "exit_code": int(exit_code),
                  "output": read(log_file),
              }

          output = {
              "warning": "HIGHLY SENSITIVE: complete GitHub JWTs and NuGet API keys",
              "github_jwts": {"jwt1": jwt1, "jwt2": jwt2},
              "exchanges": [
                  exchange_record("jwt1-first-exchange", exchange1_at, jwt1, exchange1_status, "exchange-1-response.json"),
                  exchange_record("exact-jwt1-replay", replay_at, jwt1, replay_status, "exchange-jwt1-replay-response.json"),
                  exchange_record("jwt2-first-exchange", exchange2_at, jwt2, exchange2_status, "exchange-2-response.json"),
              ],
              "temporary_api_keys": {"key1": key1, "key2": key2},
              "publishes": [
                  publish_record("key1", key1, "0.0.2", publish1_at, publish1_exit, "publish-key1-v0.0.2.log"),
                  publish_record("key2", key2, "0.0.3", publish2_at, publish2_exit, "publish-key2-v0.0.3.log"),
                  publish_record("key1", key1, "0.0.4", publish3_at, publish3_exit, "publish-key1-reuse-v0.0.4.log"),
              ],
              "hashes": {
                  "jwt1_sha256": sha256_text(jwt1), "jwt2_sha256": sha256_text(jwt2),
                  "key1_sha256": sha256_text(key1), "key2_sha256": sha256_text(key2),
              },
          }
          pathlib.Path(output_path).write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY

          jq -n \
            --arg exchange1_status "$exchange1_status" --arg replay_status "$replay_status" --arg exchange2_status "$exchange2_status" \
            --arg publish1_exit "$publish1_exit" --arg publish2_exit "$publish2_exit" --arg publish3_exit "$publish3_exit" \
            --arg key1_sha256 "$(printf '%s' "$key1" | sha256sum | cut -d' ' -f1)" \
            --arg key2_sha256 "$(printf '%s' "$key2" | sha256sum | cut -d' ' -f1)" \
            '{exchange1_status:($exchange1_status|tonumber),exact_jwt1_replay_status:($replay_status|tonumber),exchange2_status:($exchange2_status|tonumber),publish_key1_v0_0_2_exit:($publish1_exit|tonumber),publish_key2_v0_0_3_exit:($publish2_exit|tonumber),publish_key1_reuse_v0_0_4_exit:($publish3_exit|tonumber),key1_sha256:$key1_sha256,key2_sha256:$key2_sha256}' \
            > "$artifact/summary.json"

          tar -czf "$RUNNER_TEMP/nuget-evidence.tar.gz" -C "$secret" .
          openssl rand -hex 32 > "$RUNNER_TEMP/nuget-evidence-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/nuget-evidence.tar.gz" \
            -out "$artifact/evidence.tar.gz.enc" -pass file:"$RUNNER_TEMP/nuget-evidence-key"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/nuget-public.pem" \
            -in "$RUNNER_TEMP/nuget-evidence-key" -out "$artifact/evidence-key.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256

          test "$replay_status" != "200"
          test "$publish1_exit" = "0"
          test "$publish2_exit" = "0"
          test "$publish3_exit" = "0"

      - name: Upload encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-oidc-encrypted-evidence
          path: ${{ runner.temp }}/nuget-oidc-artifact/
          retention-days: 1
          if-no-files-found: error
